    <div class="synth-container">

            <h1>TAKUAN CONTROL PANEL</h1>
            <div class="status-indicator" id="status-led"></div>

        <div class="status-indicator" id="status-led"></div>

        <div class="synth-grid">
            <!-- WAVETABLES COLUMN -->
            <div class="wavetables-column">
                <!-- WAVETABLE SECTION -->
                <section class="panel wavetable-panel">
                    <div class="panel-header wavetable-header">
                        <span>OP 1</span>
                        <select id="wt_wave_select" class="wave-select"></select>
                    </div>

                    <canvas id="wavetable-viewer" width="480" height="120"></canvas>

                    <div class="controls-grid">
                        <div class="control-group">
                            <webaudio-knob id="wt_pos" src="../webaudio-controls/knobs/LittlePhatty.png" sprites="100"
                                min="0" max="127" step="1" value="0" diameter="50"></webaudio-knob>
                            <label>WT POS</label>
                        </div>
                        <div class="control-group">
                            <webaudio-knob id="wt_env_select" src="../webaudio-controls/knobs/LittlePhatty.png"
                                sprites="100" min="0" max="7" step="1" value="0" diameter="50"></webaudio-knob>
                            <label>ENV SEL</label>
                        </div>

                        <div class="control-group">
                            <webaudio-switch id="wt_lfo_on" src="../webaudio-controls/knobs/switch_toggle.png"
                                type="toggle" value="1" width="30" height="30"></webaudio-switch>
                            <label class="small-text">ON/OFF</label>
                            <webaudio-knob id="wt_lfo_pitch" src="../webaudio-controls/knobs/LittlePhatty.png"
                                sprites="100" min="0" max="3" step="1" value="0" diameter="50"></webaudio-knob>
                            <label>PITCH LFO</label>
                            <webaudio-switch id="wt_pitch_mode" src="../webaudio-controls/knobs/switch_toggle.png"
                                type="toggle" value="1" width="30" height="30"></webaudio-switch>
                            <label class="small-text">CONT/TRIG</label>
                        </div>

                        <div class="control-group">
                            <webaudio-switch id="wt_lfo_pos_on" src="../webaudio-controls/knobs/switch_toggle.png"
                                type="toggle" value="1" width="30" height="30"></webaudio-switch>
                            <label class="small-text">ON/OFF</label>
                            <webaudio-knob id="wt_lfo_pos" src="../webaudio-controls/knobs/LittlePhatty.png"
                                sprites="100" min="0" max="3" step="1" value="0" diameter="50"></webaudio-knob>
                            <label>POS LFO</label>
                            <webaudio-switch id="wt_pos_mode" src="../webaudio-controls/knobs/switch_toggle.png"
                                type="toggle" value="1" width="30" height="30"></webaudio-switch>
                            <label class="small-text">CONT/TRIG</label>
                        </div>
                        <div class="control-group">
                            <webaudio-switch id="wt_unison_on" src="../webaudio-controls/knobs/switch_toggle.png"
                                type="toggle" value="1" width="30" height="30"></webaudio-switch>
                            <label class="small-text">UNISON</label>
                            <div style="display: flex; gap: 15px; margin-top: 5px;">
                                <div style="display: flex; flex-direction: column; align-items: center;">
                                    <webaudio-knob id="wt_unison_voices" src="../webaudio-controls/knobs/LittlePhatty.png"
                                        sprites="100" min="2" max="16" step="1" value="3" diameter="40"></webaudio-knob>
                                    <label style="font-size: 8px;">VOICES</label>
                                </div>
                                <div style="display: flex; flex-direction: column; align-items: center;">
                                    <webaudio-knob id="wt_unison_detune" src="../webaudio-controls/knobs/LittlePhatty.png"
                                        sprites="100" min="0" max="100" step="1" value="30" diameter="40"></webaudio-knob>
                                    <label style="font-size: 8px;">DETUNE</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="panel wavetable-panel">
